      <h1 data-en="Architecture" data-zh="架构"></h1>
      <p class="doc-sub" data-en="How the pieces fit: an agent loop driving tools through a provider."
         data-zh="各部件如何协作：一个 agent loop 通过 provider 驱动工具。"></p>

      <figure class="diagram">
        <img src="assets/arch-overview.svg" loading="lazy"
             alt="pigo runtime layered architecture: user to CLI to agent loop to provider to LLM gateway, with tool path, session store and context compaction" />
        <figcaption data-en="Runtime layered architecture — request path, tool path, and trust/network boundaries."
                    data-zh="运行时分层架构 —— 请求路径、工具路径，以及信任与外部网络边界。"></figcaption>
      </figure>

      <h2 data-en="The agent loop" data-zh="Agent Loop"></h2>
      <p data-en="At the heart of pigo is a loop: send the conversation to the model, receive a reply that may request tool calls, execute those tools, feed the results back, and repeat until the model returns a final answer. Context compaction and memory recall hook into this loop so long runs don't overflow the window."
         data-zh="pigo 的核心是一个循环：把对话发给模型，收到可能包含工具调用的回复，执行这些工具，把结果回喂，如此往复直到模型给出最终回答。上下文压缩与记忆检索挂接在此循环上，使长时运行不会撑爆窗口。"></p>
      <p data-en="Concretely it is a <strong>two-tier</strong> loop. The inner <em>turn loop</em> streams one model reply, dispatches on the stop-reason (tool-use vs. end), executes any requested tools, appends their results, and refills — spinning until the model stops asking for tools. The outer <em>follow-up loop</em> handles multi-message flows (e.g., queued input, compaction, checkpoint recall). Both tiers converge on a single <code>finish()</code> exit, so there is exactly one place the run can end — which keeps cleanup and state-flushing correct."
         data-zh="具体而言这是一个<strong>两层</strong>循环。内层的 <em>turn 循环</em> 流式接收一条模型回复，按 stop-reason 分派（工具调用 vs. 结束），执行请求的工具，追加其结果并回填 —— 一直转到模型不再请求工具。外层的 <em>后续消息循环</em> 处理多消息流程（如排队输入、压缩、检查点恢复）。两层统一汇于唯一出口 <code>finish()</code>，因此运行只有一个结束点 —— 这让清理与状态落盘始终正确。"></p>

      <figure class="diagram">
        <img src="assets/agent-loop-flowchart.svg" loading="lazy"
             alt="pigo two-tier agent loop flowchart: inner turn loop and outer follow-up loop converging on a single finish() exit" />
        <figcaption data-en="The two-tier loop — inner turn loop and outer follow-up loop, all converging on a single finish()."
                    data-zh="两层循环 —— 内层 turn 循环与外层后续消息循环，统一汇于唯一出口 finish()。"></figcaption>
      </figure>

      <h2 data-en="AgentCore" data-zh="AgentCore"></h2>
      <p data-en="<code>AgentCore</code> owns the loop and the conversation state. It orchestrates the turn: assembling the layered system prompt, deciding when to compact, dispatching tool calls, and enforcing approval policy. It is provider- and UI-agnostic — the same core drives both headless <code>-p</code> runs and the interactive TUI."
         data-zh="<code>AgentCore</code> 持有循环与对话状态。它编排每一轮：组装分层系统提示词、决定何时压缩、派发工具调用、执行批准策略。它与 provider 和 UI 无关 —— 同一个核心既驱动无头 <code>-p</code> 运行，也驱动交互式 TUI。"></p>
      <p data-en="The layered system prompt is built general-to-specific: a built-in base, an environment block (OS, shell, cwd, date, git state), then project instruction files (<code>PIGO.md</code>/<code>CLAUDE.md</code>/<code>AGENTS.md</code>) walked from the repo root down to the working directory. Because one core serves every UI, a prompt behaves identically whether you invoked it from CI or typed it into the TUI."
         data-zh="分层系统提示词按从通用到具体构建：内置基座、环境信息块（操作系统、shell、当前目录、日期、git 状态），再到从仓库根目录向下走到工作目录的项目指令文件（<code>PIGO.md</code>/<code>CLAUDE.md</code>/<code>AGENTS.md</code>）。因为同一核心服务所有 UI，无论你是从 CI 调用还是在 TUI 里输入，提示词行为都完全一致。"></p>

      <h2 data-en="Provider abstraction" data-zh="Provider 抽象"></h2>
      <p data-en="A <code>Provider</code> is the thin adapter between AgentCore and a model endpoint. It normalizes request/response shapes across wire protocols (OpenAI-compatible, Anthropic) and resolves credentials from <code>&lt;PROVIDER&gt;_API_KEY</code> env vars. Adding a backend means implementing this one interface — the loop above never changes."
         data-zh="<code>Provider</code> 是 AgentCore 与模型端点之间的薄适配层。它跨通信协议（OpenAI 兼容、Anthropic）归一化请求/响应结构，并从 <code>&lt;PROVIDER&gt;_API_KEY</code> 环境变量解析凭据。新增后端只需实现这一个接口 —— 上层循环无需改动。"></p>
      <p data-en="pigo ships a registry of ~35 providers and picks one by matching the model-name prefix (<code>claude-*</code> → Anthropic, <code>gpt-*</code> → OpenAI, <code>qwen-*</code> → DashScope, and so on), or you force one with <code>--provider</code> / a raw <code>-u</code> base URL. Because the abstraction is protocol-level rather than vendor-level, one adapter serves every OpenAI-compatible endpoint at once."
         data-zh="pigo 内置约 35 个 provider 的注册表，通过匹配模型名前缀选择其一（<code>claude-*</code> → Anthropic、<code>gpt-*</code> → OpenAI、<code>qwen-*</code> → DashScope 等），也可用 <code>--provider</code> / 原始 <code>-u</code> base URL 强制指定。由于抽象作用在协议层而非厂商层，一个适配器即可同时服务所有 OpenAI 兼容端点。"></p>
      <div class="note" data-en="<strong>Design contrast:</strong> GUI agents like Cursor bake provider logic into the app. pigo's protocol-level Provider interface is why a brand-new OpenAI-compatible service works with zero code — just a base URL and a key."
           data-zh="<strong>设计对比：</strong>Cursor 这类 GUI Agent 把 provider 逻辑固化进应用。pigo 协议级的 Provider 接口，正是让一个全新的 OpenAI 兼容服务零代码即可工作的原因 —— 只需一个 base URL 和一把 key。"></div>

      <h2 data-en="Tool system" data-zh="工具系统"></h2>
      <p data-en="Tools are the agent's hands. Each tool declares a name, a JSON schema, and an executor. AgentCore exposes the tool set to the model, validates the model's arguments against the schema, runs the executor, and returns the result as a tool message. Built-in tools (read/write/edit/grep/find/bash/todo/webfetch) share the same contract as plugin- and skill-provided tools."
         data-zh="工具是 agent 的双手。每个工具声明名称、JSON schema 与执行器。AgentCore 把工具集暴露给模型，按 schema 校验模型给出的参数，运行执行器，并把结果作为工具消息返回。内置工具（read/write/edit/grep/find/bash/todo/webfetch）与插件、skill 提供的工具遵循同一契约。"></p>

      <h2 data-en="Runtime components" data-zh="运行时组件"></h2>
      <p data-en="Around the core sit the runtime services: session store (persist/resume/fork/clone), the prompt-template &amp; slash-command registry, skills and plugins, hooks at lifecycle points, persistent memory with <code>memory_search</code>, and checkpointing. The CLI layer wires these together and hands AgentCore a fully configured run."
         data-zh="核心之外是运行时服务：会话存储（持久化/续跑/fork/clone）、提示词模板与 slash 命令注册表、skills 与插件、生命周期节点上的 hooks、带 <code>memory_search</code> 的持久记忆，以及检查点。CLI 层把它们装配起来，交给 AgentCore 一次完整配置好的运行。"></p>
      <p data-en="These services are intentionally decoupled from the loop: the session store just serializes state, hooks are shell-outs gated by matcher rules and exit codes, and memory/checkpoint are pluggable via the <code>[memory]</code> and <code>[checkpoint]</code> config tables. That separation is what makes pigo hackable — you can add a skill, a hook, or a whole plugin without touching AgentCore, and package them for reuse across projects."
         data-zh="这些服务刻意与循环解耦：会话存储只负责序列化状态，hooks 是受匹配规则与退出码约束的外部 shell 调用，记忆/检查点通过 <code>[memory]</code> 与 <code>[checkpoint]</code> 配置表可插拔。正是这种分离让 pigo 易于定制 —— 你可以新增一个 skill、一个 hook 或整个插件而无需触碰 AgentCore，并把它们打包在项目间复用。"></p>
