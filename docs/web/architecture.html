      <h1 data-en="Architecture" data-zh="架构"></h1>
      <p class="doc-sub" data-en="How the pieces fit: an agent loop driving tools through a provider."
         data-zh="各部件如何协作：一个 agent loop 通过 provider 驱动工具。"></p>

      <h2 data-en="The agent loop" data-zh="Agent Loop"></h2>
      <p data-en="At the heart of pigo is a loop: send the conversation to the model, receive a reply that may request tool calls, execute those tools, feed the results back, and repeat until the model returns a final answer. Context compaction and memory recall hook into this loop so long runs don't overflow the window."
         data-zh="pigo 的核心是一个循环：把对话发给模型，收到可能包含工具调用的回复，执行这些工具，把结果回喂，如此往复直到模型给出最终回答。上下文压缩与记忆检索挂接在此循环上，使长时运行不会撑爆窗口。"></p>

      <h2 data-en="AgentCore" data-zh="AgentCore"></h2>
      <p data-en="<code>AgentCore</code> owns the loop and the conversation state. It orchestrates the turn: assembling the layered system prompt, deciding when to compact, dispatching tool calls, and enforcing approval policy. It is provider- and UI-agnostic — the same core drives both headless <code>-p</code> runs and the interactive REPL."
         data-zh="<code>AgentCore</code> 持有循环与对话状态。它编排每一轮：组装分层系统提示词、决定何时压缩、派发工具调用、执行批准策略。它与 provider 和 UI 无关 —— 同一个核心既驱动无头 <code>-p</code> 运行，也驱动交互式 REPL。"></p>

      <h2 data-en="Provider abstraction" data-zh="Provider 抽象"></h2>
      <p data-en="A <code>Provider</code> is the thin adapter between AgentCore and a model endpoint. It normalizes request/response shapes across wire protocols (OpenAI-compatible, Anthropic) and resolves credentials from <code>&lt;PROVIDER&gt;_API_KEY</code> env vars. Adding a backend means implementing this one interface — the loop above never changes."
         data-zh="<code>Provider</code> 是 AgentCore 与模型端点之间的薄适配层。它跨通信协议（OpenAI 兼容、Anthropic）归一化请求/响应结构，并从 <code>&lt;PROVIDER&gt;_API_KEY</code> 环境变量解析凭据。新增后端只需实现这一个接口 —— 上层循环无需改动。"></p>

      <h2 data-en="Tool system" data-zh="工具系统"></h2>
      <p data-en="Tools are the agent's hands. Each tool declares a name, a JSON schema, and an executor. AgentCore exposes the tool set to the model, validates the model's arguments against the schema, runs the executor, and returns the result as a tool message. Built-in tools (read/write/edit/grep/find/bash/todo/webfetch) share the same contract as plugin- and skill-provided tools."
         data-zh="工具是 agent 的双手。每个工具声明名称、JSON schema 与执行器。AgentCore 把工具集暴露给模型，按 schema 校验模型给出的参数，运行执行器，并把结果作为工具消息返回。内置工具（read/write/edit/grep/find/bash/todo/webfetch）与插件、skill 提供的工具遵循同一契约。"></p>

      <h2 data-en="Runtime components" data-zh="运行时组件"></h2>
      <p data-en="Around the core sit the runtime services: session store (persist/resume/fork/clone), the prompt-template &amp; slash-command registry, skills and plugins, hooks at lifecycle points, persistent memory with <code>memory_search</code>, and checkpointing. The CLI layer wires these together and hands AgentCore a fully configured run."
         data-zh="核心之外是运行时服务：会话存储（持久化/续跑/fork/clone）、提示词模板与 slash 命令注册表、skills 与插件、生命周期节点上的 hooks、带 <code>memory_search</code> 的持久记忆，以及检查点。CLI 层把它们装配起来，交给 AgentCore 一次完整配置好的运行。"></p>
